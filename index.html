<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Monitoreo Salidas - Almacén Zapata</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      font-family:Arial,sans-serif;
      background:linear-gradient(to right,#00416A,#E4E5E6);
      margin:0;
      padding:20px;
      color:white;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
    }

    .filtros{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
      margin-bottom:25px;
    }

    .filtros select,
    .filtros input{
      padding:10px;
      border:none;
      border-radius:8px;
      font-size:15px;
      min-width:180px;
    }

    .contenedor-tarjetas{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:20px;
    }

    .tarjeta{
      background:white;
      color:black;
      border-radius:12px;
      padding:15px;
      box-shadow:0 4px 12px rgba(0,0,0,.25);
    }

    .tarjeta h3{
      margin-top:0;
      color:#00416A;
      font-size:18px;
      word-break:break-word;
    }

    .campo{
      margin-bottom:8px;
      font-size:14px;
    }

    .campo strong{
      color:#222;
    }

    ul{
      padding-left:18px;
      margin-top:5px;
    }

    li{
      margin-bottom:6px;
      font-size:14px;
    }

    .firmas{
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-top:20px;
    }

    .firma{
      flex:1;
      text-align:center;
    }

    .firma img{
      width:100%;
      max-width:140px;
      height:80px;
      object-fit:contain;
      border:1px solid #ccc;
      border-radius:5px;
      background:white;
    }

    .firma label{
      display:block;
      margin-top:5px;
      font-size:12px;
      color:#555;
    }

    .sin-resultados{
      text-align:center;
      font-size:18px;
      margin-top:40px;
      color:white;
    }

  </style>
</head>

<body>

<h1>Monitoreo de Salidas - Almacén Zapata</h1>

<div class="filtros">

  <!-- 🔥 SOLO MES ACTUAL -->
  <select id="mes" onchange="filtrarSalidas()">

    <option value="01">Enero</option>
    <option value="02">Febrero</option>
    <option value="03">Marzo</option>
    <option value="04">Abril</option>
    <option value="05">Mayo</option>
    <option value="06">Junio</option>
    <option value="07">Julio</option>
    <option value="08">Agosto</option>
    <option value="09">Septiembre</option>
    <option value="10">Octubre</option>
    <option value="11">Noviembre</option>
    <option value="12">Diciembre</option>

  </select>

  <!-- 🔥 BUSCAR POR FECHA -->
  <input
    type="date"
    id="fechaBusqueda"
    onchange="filtrarSalidas()"
  />

</div>

<div
  class="contenedor-tarjetas"
  id="contenedorTarjetas"
></div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

  apiKey: "AIzaSyCK5nb6u2CGRJ8AB1aPlRn54b97bdeAFeM",

  authDomain: "inventariopv-643f1.firebaseapp.com",

  projectId: "inventariopv-643f1",

  storageBucket: "inventariopv-643f1.appspot.com",

  messagingSenderId: "96242533231",

  appId: "1:96242533231:web:aae75a18fbaf9840529e9a"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const contenedor =
  document.getElementById("contenedorTarjetas");

let todasLasSalidas = [];

/* ==========================================
   CARGAR SALIDAS
========================================== */

async function cargarSalidas(){

  try{

    todasLasSalidas = [];

    const q1 = query(

      collection(
        db,
        "almacenes",
        "almacen_zapata",
        "salidas1.0"
      )

    );

    const snap = await getDocs(q1);

    snap.forEach(doc => {

      const data = doc.data();

      todasLasSalidas.push(data);

    });

    // 🔥 MÁS NUEVOS ARRIBA
    todasLasSalidas.sort((a,b)=>{

      return String(b.folio || "")
        .localeCompare(String(a.folio || ""));

    });

    filtrarSalidas();

  }catch(error){

    console.error(error);

    contenedor.innerHTML = `
      <div class="sin-resultados">
        Error cargando datos
      </div>
    `;

  }

}

/* ==========================================
   RENDER
========================================== */

function renderizarTarjetas(lista){

  contenedor.innerHTML = "";

  if(lista.length === 0){

    contenedor.innerHTML = `
      <div class="sin-resultados">
        No hay salidas registradas
      </div>
    `;

    return;

  }

  lista.forEach(data => {

    const tarjeta =
      document.createElement("div");

    tarjeta.className = "tarjeta";

    tarjeta.innerHTML = `

      <h3>
        Folio:
        ${data.folio || "Sin folio"}
      </h3>

      <div class="campo">
        <strong>Fecha:</strong>
        ${
          data.fecha
            ? new Date(data.fecha)
                .toLocaleString("es-MX")
            : "Sin fecha"
        }
      </div>

      <div class="campo">
        <strong>Entrega:</strong>
        ${data.entrega || "N/D"}
      </div>

      <div class="campo">
        <strong>Recibe:</strong>
        ${data.recibe || "N/D"}
      </div>

      <div class="campo">
        <strong>Destino:</strong>
        ${data.destino || "N/D"}
      </div>

      <div class="campo">
        <strong>Cincho:</strong>
        ${data.folioCincho || "Sin asignar"}
      </div>

      <div class="campo">
        <strong>Artículos:</strong>
      </div>

      <ul>

        ${(data.articulos || []).map(item => `

          <li>

            ${item.nombre || "Sin nombre"}

            <br>

            Código:
            ${item.codigo || "N/D"}

            <br>

            Cantidad:
            ${item.cantidad || 0}

          </li>

        `).join("")}

      </ul>

      <div class="firmas">

        <div class="firma">

          <img
            src="${data.firmaEntrega || ""}"
            alt="Firma entrega"
          >

          <label>Firma entrega</label>

        </div>

        <div class="firma">

          <img
            src="${data.firmaRecibe || ""}"
            alt="Firma recibe"
          >

          <label>Firma recibe</label>

        </div>

      </div>

    `;

    contenedor.appendChild(tarjeta);

  });

}

/* ==========================================
   FILTRO
========================================== */

window.filtrarSalidas = function(){

  const mesSeleccionado =
    document.getElementById("mes").value;

  const fechaBusqueda =
    document.getElementById("fechaBusqueda").value;

  let filtradas = [...todasLasSalidas];

  /* ==========================================
     FILTRAR POR MES
  ========================================== */

  filtradas = filtradas.filter(data => {

    if(!data.fecha) return false;

    const fechaObj =
      new Date(data.fecha);

    if(isNaN(fechaObj)) return false;

    const mes =
      String(fechaObj.getMonth() + 1)
      .padStart(2,"0");

    return mes === mesSeleccionado;

  });

  /* ==========================================
     FILTRO FECHA EXACTA
  ========================================== */

  if(fechaBusqueda){

    filtradas = filtradas.filter(data => {

      if(!data.fecha) return false;

      const fechaObj =
        new Date(data.fecha);

      if(isNaN(fechaObj)) return false;

      const yyyy =
        fechaObj.getFullYear();

      const mm =
        String(fechaObj.getMonth() + 1)
        .padStart(2,"0");

      const dd =
        String(fechaObj.getDate())
        .padStart(2,"0");

      const fechaFormateada =
        `${yyyy}-${mm}-${dd}`;

      return fechaFormateada === fechaBusqueda;

    });

  }

  renderizarTarjetas(filtradas);

}

/* ==========================================
   MES ACTUAL AUTOMÁTICO
========================================== */

const hoy = new Date();

const mesActual =
  String(hoy.getMonth() + 1)
  .padStart(2,"0");

document.getElementById("mes").value =
  mesActual;

/* ==========================================
   INICIAR
========================================== */

cargarSalidas();

</script>

</body>
</html>
